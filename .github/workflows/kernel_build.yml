name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - stock-14

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget curl flex bison build-essential zip libssl-dev bc python3 cpio kmod libelf-dev lz4 unzip

    - name: Set swap
      run: |
        sudo fallocate -l 4G /swapfile || true
        sudo chmod 600 /swapfile || true
        sudo mkswap /swapfile || true
        sudo swapon /swapfile || true
        swapon --show

    - name: Build Kernel
      run: |
        set -e
        KDIR=$(pwd)
        export ARCH=arm64
        export SUBARCH=arm64

        # Download clang with retries
        mkdir -p clang
        for i in 1 2 3 4 5; do
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r12/clang-r416183b1.tar.gz && break
          sleep 10
        done
        tar -xf clang.tar.gz -C clang
        rm -rf clang.tar.gz

        # Download GCC toolchains
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 arm64-gcc
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-gcc

        export PATH=$KDIR/clang/bin:$KDIR/arm64-gcc/bin:$KDIR/arm-gcc/bin:/usr/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILER_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=$KDIR/clang/bin/clang

        # AnyKernel3
        git clone --depth=1 https://github.com/MrR0b0X/anykernel3 -b a23 anykernel3

        # Bump version in defconfig
        scripts/config --file arch/arm64/configs/nethunter_defconfig --set-str CONFIG_LOCALVERSION "-MrR0b0X-4.19.157"
        scripts/config --file arch/arm64/configs/nethunter_defconfig --enable CONFIG_NO_HZ_COMMON
        scripts/config --file arch/arm64/configs/nethunter_defconfig --enable CONFIG_NO_HZ_FULL
        scripts/config --file arch/arm64/configs/nethunter_defconfig --enable CONFIG_NO_HZ_IDLE
        scripts/config --file arch/arm64/configs/nethunter_defconfig --enable CONFIG_CONTEXT_TRACKING
        scripts/config --file arch/arm64/configs/nethunter_defconfig --enable CONFIG_CONTEXT_TRACKING_FORCE
        scripts/config --file arch/arm64/configs/nethunter_defconfig --enable CONFIG_INPUT_SEC_INPUT
        scripts/config --file arch/arm64/configs/nethunter_defconfig --enable CONFIG_PINCTRL

        # Patch WALT API mismatch: Samsung fair.c calls prefer_spread_on_idle(cpu, bool) but walt.h defines it with 1 arg
        sed -i 's/prefer_spread_on_idle(int cpu)/prefer_spread_on_idle(int cpu, bool unused)/' kernel/sched/walt.h

        # Generate .config from defconfig
        make -j$(nproc) ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILER_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- CC=$KDIR/clang/bin/clang nethunter_defconfig

        # Build
        make -j$(nproc) ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILER_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- CC=$KDIR/clang/bin/clang DTC_EXT=$KDIR/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y 2>&1 | tee log.txt

        # Check result
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "BUILD SUCCESS"
        else
          echo "BUILD FAILED - checking alternatives..."
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "No boot dir"
          cat log.txt | tail -30
          exit 1
        fi

    - name: Create ZIP
      run: |
        KDIR=$(pwd)
        mv out/arch/arm64/boot/Image.gz-dtb anykernel3/
        cd anykernel3
        zip -r9 Nethunter-a23-4.19.157.zip . -x ".git*" "README.md" "LICENSE" "*.zip"
        ls -la *.zip
        cd $KDIR

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: kernel-zip
        path: anykernel3/*.zip
