name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - stock-14

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget curl flex bison build-essential zip libssl-dev bc python3 cpio kmod libelf-dev lz4 unzip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

    - name: Set swap
      run: |
        sudo fallocate -l 4G /swapfile || true
        sudo chmod 600 /swapfile || true
        sudo mkswap /swapfile || true
        sudo swapon /swapfile || true
        swapon --show

    - name: Build Kernel
      run: |
        set -e
        KDIR=$(pwd)
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        # AnyKernel3
        git clone --depth=1 https://github.com/MrR0b0X/anykernel3 -b a23 anykernel3

        # Bump version in defconfig
        scripts/config --file arch/arm64/configs/nethunter_defconfig --set-str CONFIG_LOCALVERSION "-MrR0b0X-4.19.157"

        # Generate .config from defconfig
        make -j$(nproc) ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- nethunter_defconfig

        # Build
        make -j$(nproc) ARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- DTC_EXT=$KDIR/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y 2>&1 | tee log.txt

        # Check result
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "BUILD SUCCESS"
        else
          echo "BUILD FAILED - checking alternatives..."
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "No boot dir"
          cat log.txt | tail -30
          exit 1
        fi

    - name: Create ZIP
      run: |
        KDIR=$(pwd)
        mv out/arch/arm64/boot/Image.gz-dtb anykernel3/
        cd anykernel3
        zip -r9 Nethunter-a23-4.19.157.zip . -x ".git*" "README.md" "LICENSE" "*.zip"
        ls -la *.zip
        cd $KDIR

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: kernel-zip
        path: anykernel3/*.zip
